# Minimal btrbk config for on-demand snapshots of `/`
# Usage:  sudo btrbk run            # snapshot + prune per policy
#         sudo btrbk -n run         # dry-run (show what would happen)
#         sudo btrbk list snapshots

timestamp_format        long              # e.g. 2026-05-20T12:00:00-0400
snapshot_preserve_min   2d                # never delete snapshots < 2 days old
snapshot_preserve       7d 4w             # keep 7 daily + 4 weekly
snapshot_create         always            # always create on `btrbk run`

volume /
  subvolume .
    snapshot_dir .snapshots
