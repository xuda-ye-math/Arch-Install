<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <!-- Global rendering: antialias on, hinting on at medium strength,
       autohinter off so the font's own hints win. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintmedium</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Default sans-serif (this is also what apps fall back to when no
       family is specified, i.e. the "default" font). -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <!-- Default serif. -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- Default monospace. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Consolas Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

</fontconfig>
