preload = /usr/share/hypr/wall2.png

wallpaper {
    # Set `monitor =` to your output name, e.g. HDMI-A-1, DP-1, eDP-1.
    # Find it with `hyprctl monitors` (look at the "Monitor <name>" line);
    # leaving it blank applies the wallpaper to all connected outputs.
    # monitor = HDMI-A-1
    path = /usr/share/hypr/wall2.png
    fit_mode = cover
}

splash = false
ipc = off
