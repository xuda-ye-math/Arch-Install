# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Monitor + scale. Format: NAME, RESOLUTION@REFRESH, POSITION, SCALE.
# Commented out because the output name and resolution are machine-specific.
# Run `hyprctl monitors` to find your output name and supported modes, then
# uncomment and adjust to match your setup.
# monitor = HDMI-A-1, 3840x2160@120, 0x0, 2

# desktop setting
exec-once = hyprpaper
exec-once = fcitx5-remote

# x11 config
exec-once = echo "Xft.dpi: 200" > ~/.Xresources
exec-once = xrdb -merge ~/.Xresources

# Bridge the Hyprland session into systemd so xdg-desktop-portal can start
# (xdg-desktop-portal >= 1.22 requires graphical-session.target to be active).
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

# Polkit auth agent: provides GUI password dialogs for pkexec
exec-once = systemctl --user enable --now hyprpolkitagent.service

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher
$browser = google-chrome-stable
$editor = code

# Most app-launcher binds sit on the left half of the keyboard to keep them
# away from hyprshutdown ($mainMod + M) and reduce the chance of a misfire.
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, C, exec, $editor
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, D, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, G, exec, $browser
# This fullscreen preserves the toolbars / URL bar in Chrome and VS Code.
# For marginless, chrome-less windows, press F11 (browser-level) or change this to: fullscreen, 0
bind = $mainMod, F, fullscreenstate, 2, 0
# Screenshots via grim (+ slurp for region select); saved to $HOME as YYMMDD_HH-MM-SS.png.
# Note: the full-screen capture (Super+X) gives no on-screen confirmation — just
# check $HOME for the file. To see grim's stdout/stderr, run the same command
# in a terminal instead of via this keybind.
bind = $mainMod, Z, exec, grim -g "$(slurp)" "$HOME/$(date +'%y%m%d_%H-%M-%S').png"
bind = $mainMod, X, exec, grim "$HOME/$(date +'%y%m%d_%H-%M-%S').png"

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod, right, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, left,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Laptop-monitor brightess via `brightnessctl`
# bindel = $mainMod, up,   exec, brightnessctl set +5%
# bindel = $mainMod, down, exec, brightnessctl set 5%-
# External-monitor brightness via DDC/CI. Requires `ddcutil` installed and the
# i2c-dev kernel module loaded; --bus N is monitor-specific (find with `ddcutil detect`).
# bindel = $mainMod, up,    exec, ddcutil --bus 1 setvcp 10 + 5
# bindel = $mainMod, down,  exec, ddcutil --bus 1 setvcp 10 - 5
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

input {
    sensitivity = -0.1
    accel_profile = flat
    follow_mouse = 0
}

general {
    border_size = 2
    col.active_border = rgba(00008bff)
}

xwayland {
    force_zero_scaling = true
}
